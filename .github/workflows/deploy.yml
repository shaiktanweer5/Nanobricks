name: Deploy Nanobricks Website

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::857931482828:role/NanobricksGitHubDeployRole
          aws-region: ap-south-1

      - name: Deploy website to S3
        run: |
          aws s3 sync . s3://nanobricks.in \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".gitignore"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E9KQ670OGVU6F \
            --paths "/*"